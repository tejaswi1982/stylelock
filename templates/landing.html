<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;min-height:100%;background:#081712}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
    color:#f3efe3;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  :root{
    --volt:#c8e600;
    --cream-dim:rgba(243,239,227,0.72);
    --ink-muted:rgba(243,239,227,0.5);
  }

  .hero{
    position:relative;
    width:100%;
    min-height:100vh;
    min-height:100svh;
    min-height:100dvh;
    background:#0d211d url('/static/images/home-hero-latest.jpg?v={{ app_version }}') center center / cover no-repeat;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:
      calc(28px + env(safe-area-inset-top,0px))
      max(22px,env(safe-area-inset-right,0px))
      calc(34px + env(safe-area-inset-bottom,0px))
      max(22px,env(safe-area-inset-left,0px));
  }
  .hero::after{
    content:'';
    position:absolute;
    left:0;right:0;bottom:0;
    height:24%;
    background:linear-gradient(to top,rgba(8,18,15,0.72),rgba(8,18,15,0));
    pointer-events:none;
    z-index:1;
  }
  .hero-cta-wrap{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    width:100%;
  }
  .hero-bars{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:14px;
  }
  .hero-bars span{
    width:62px;
    height:3px;
    border-radius:999px;
    background:rgba(243,239,227,0.2);
    position:relative;
    overflow:hidden;
  }
  .hero-bars span.active::after{
    content:'';
    position:absolute;
    inset:0;
    width:100%;
    background:linear-gradient(90deg,var(--volt),#f0ffc1);
    box-shadow:0 0 10px rgba(200,230,0,0.5);
  }
  .cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:min(320px,82%);
    padding:18px 22px;
    border-radius:14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    color:#10221c;
    background:linear-gradient(180deg,#d9f74f 0%,#bfde1a 100%);
    border:1px solid rgba(200,230,0,0.68);
    box-shadow:0 10px 22px rgba(0,0,0,0.32),0 0 22px rgba(200,230,0,0.18);
    transition:transform .18s ease;
    -webkit-appearance:none;
    touch-action:manipulation;
    cursor:pointer;
  }
  .cta:active{transform:scale(.985)}
  .cta-sub{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--cream-dim);
    margin-top:6px;
    text-transform:uppercase;
  }
  footer.foot{
    position:absolute;
    left:0;
    right:0;
    bottom:calc(8px + env(safe-area-inset-bottom,0px));
    z-index:2;
    padding:0 24px;
    text-align:center;
    pointer-events:none;
  }
  .foot-sig{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.28em;
    color:var(--ink-muted);
    text-transform:uppercase;
  }

  @media (min-width: 960px){
    .hero{
      margin:20px auto;
      width:min(430px, calc(100vw - 48px));
      min-height:min(calc(100dvh - 40px), 860px);
      border-radius:28px;
      box-shadow:
        0 26px 64px rgba(0,0,0,0.42),
        inset 0 0 0 1px rgba(243,239,227,0.05);
    }
  }
</style>
</head>
<body>
<section class="hero" id="heroSection">
  <div class="hero-cta-wrap">
    <div class="hero-bars" aria-hidden="true">
      <span></span><span class="active"></span><span></span>
    </div>
    <a class="cta" href="/app" id="heroCta">UPLOAD A SELFIE</a>
    <div class="cta-sub">One selfie · 60 seconds · ₹79 once</div>
  </div>

  <footer class="foot">
    <div class="foot-sig">STYLELOCK &nbsp;//&nbsp; IDENTITY &nbsp;//&nbsp; '26</div>
  </footer>
</section>
