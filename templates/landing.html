<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10241f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StyleLock — Your next self, unlocked</title>
<meta name="description" content="Upload a selfie. See 3 hairstyle looks. Get a barber-ready cut card.">
<meta property="og:title" content="StyleLock — Your next self, unlocked">
<meta property="og:description" content="Upload a selfie. See 3 hairstyle looks. Get a barber-ready cut card.">
<meta property="og:type" content="website">
<style>
  /* Inline-only CSS — zero external deps for fastest Instagram/FB webview load. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 100% at 50% 4%,#1e463c 0%,#102821 43%,#091712 100%);
    color:#f3efe3;
    min-height:100vh;
    min-height:100svh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:
      calc(28px + env(safe-area-inset-top,0px))
      max(22px,env(safe-area-inset-right,0px))
      calc(28px + env(safe-area-inset-bottom,0px))
      max(22px,env(safe-area-inset-left,0px));
    text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .mark{
    font-weight:700;
    font-size:12px;
    letter-spacing:0.4em;
    color:#d7f54c;
    text-transform:uppercase;
  }
  h1{
    font-size:clamp(30px,8.2vw,42px);
    line-height:1.05;
    font-weight:700;
    letter-spacing:-0.01em;
    color:rgba(243,239,227,0.98);
  }
  h1 .accent{color:#d7f54c}
  p.sub{
    font-size:15px;
    line-height:1.5;
    color:rgba(243,239,227,0.74);
    max-width:360px;
  }
  a.cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:320px;
    padding:17px 22px;
    border-radius:14px;
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-decoration:none;
    color:#10221c;
    background:linear-gradient(180deg,#d9f74f 0%,#bfde1a 100%);
    border:1px solid rgba(200,230,0,0.68);
    box-shadow:0 10px 22px rgba(0,0,0,0.32),0 0 22px rgba(200,230,0,0.18);
    transition:transform .18s ease;
    margin-top:6px;
    -webkit-appearance:none;
    touch-action:manipulation;
  }
  a.cta:active{transform:scale(.985)}
  .hint{
    font-size:12.5px;
    line-height:1.5;
    color:rgba(243,239,227,0.82);
    max-width:340px;
    margin-top:6px;
    padding:10px 14px;
    border:1px solid rgba(215,245,76,0.28);
    border-radius:10px;
    background:rgba(8,20,16,0.42);
  }
  .hint b{
    color:rgba(215,245,76,0.95);
    font-weight:700;
  }
  .meta-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:11px;
    color:rgba(243,239,227,0.42);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-top:2px;
  }
  .dot{width:3px;height:3px;border-radius:50%;background:rgba(215,245,76,0.6)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">StyleLock</div>
  <h1>Your next self, <span class="accent">unlocked.</span></h1>
  <p class="sub">Upload a selfie. See 3 hairstyle looks. Get a barber-ready cut card.</p>
  <a class="cta" href="/app" id="openBtn">Open StyleLock</a>
  <p class="hint" id="hint">If this opens oddly in Instagram, tap &#8226;&#8226;&#8226; and choose <b>Open in browser</b>.</p>
  <div class="meta-row">
    <span>AI</span><span class="dot"></span><span>Barber-ready</span><span class="dot"></span><span>Rs 79</span>
  </div>
</div>

<!-- Meta Pixel — same account as main app, for PageView continuity on ad traffic. -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',

fbq('init','1868174307106082');
fbq('track','PageView');
</script>
<noscript><img height="1" width="1" style="display:none"

</body>
</html>
