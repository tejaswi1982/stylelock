<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a2f2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>StyleLock</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;600&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/stylelock.css">
  
  <!-- Razorpay (payment gateway) -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  
  <!-- ========================================
       HOME SCREEN
       ======================================== -->
  <div id="screen-home" class="screen active">
    <button class="home-hotspot" id="home-unlock-btn" aria-label="Unlock for ₹49"></button>
  </div>
  
  
  <!-- ========================================
       UPLOAD SCREEN
       ======================================== -->
  <div id="screen-upload" class="screen">
    <!-- Tap area for frame -->
    <button class="upload-frame-hotspot" id="upload-frame-btn" aria-label="Select photo"></button>
    
    <!-- Preview overlay -->
    <div class="upload-preview-overlay" id="upload-preview-container">
      <img id="upload-preview" src="" alt="Your photo">
    </div>
    
    <!-- Take photo button hotspot -->
    <button class="upload-hotspot" id="upload-take-btn" aria-label="Take photo"></button>
    
    <!-- Hidden file inputs -->
    <input type="file" id="camera-input" accept="image/*" capture="user">
    <input type="file" id="library-input" accept="image/*">
    <input type="file" id="file-input" accept="image/*">
  </div>
  
  
  <!-- ========================================
       ACTION SHEET (iOS-style photo picker)
       ======================================== -->
  <div class="action-sheet-overlay" id="action-sheet">
    <div class="action-sheet">
      <div class="action-sheet-group">
        <button class="action-sheet-btn" id="photo-library-btn">Photo Library</button>
        <button class="action-sheet-btn" id="take-photo-btn">Take Photo</button>
        <button class="action-sheet-btn" id="choose-file-btn">Choose File</button>
      </div>
      <button class="action-sheet-cancel" id="cancel-sheet-btn">Cancel</button>
    </div>
  </div>
  
  
  <!-- ========================================
       LOADING / READING SCREEN
       Background image contains: READING title, frame, "stay with me", 
       "Finding your next self", and progress bar track.
       We just overlay the selfie and animate the progress fill.
       ======================================== -->
  <div id="screen-loading" class="screen">
    <!-- User's selfie overlaid on the frame in background -->
    <div class="loading-selfie-container">
      <img id="loading-selfie" src="" alt="Your selfie">
    </div>
    
    <!-- Progress bar fill - animates on top of the track in background -->
    <div class="loading-progress-overlay">
      <div class="loading-progress-fill" id="progress-fill"></div>
    </div>
  </div>
  
  
  <!-- ========================================
       RESULTS SCREEN
       ======================================== -->
  <div id="screen-results" class="screen">
    <header class="results-header">
      <h1 class="results-title">YOUR 3 LOOKS</h1>
    </header>
    
    <div class="results-swiper" id="results-swiper">
      <!-- Slides rendered by JavaScript -->
    </div>
    
    <div class="results-dots" id="results-dots">
      <!-- Dots rendered by JavaScript -->
    </div>
  </div>
  
  
  <!-- ========================================
       CUT CARD SCREEN
       ======================================== -->
  <div id="screen-cutcard" class="screen">
    <h1 class="cutcard-title">YOUR CUT CARD</h1>
    
    <div class="cutcard-container" id="cutcard-content">
      <!-- Content rendered by JavaScript -->
    </div>
  </div>
  
  
  <!-- ========================================
       BARBER MODE SCREEN
       ======================================== -->
  <div id="screen-barber" class="screen">
    <header class="barber-header">
      <h1 class="barber-title">BARBER MODE</h1>
      <button class="barber-close" id="barber-close" aria-label="Close">✕</button>
    </header>
    
    <div id="barber-content">
      <!-- Content rendered by JavaScript -->
    </div>
  </div>
  
  
  <!-- Application JavaScript -->
  <script src="/static/js/app.js"></script>
  
</body>
</html>
