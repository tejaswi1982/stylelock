<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10241f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StyleLock</title>
    <style>
        body.app-booting .screen { display: none !important; }
        body.app-booting #homeScreen { display: flex !important; flex-direction: column; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/stylelock.css?v={{ app_version }}">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="app-booting">
<div class="screen home active" id="homeScreen">
    <div class="home-bg" style="background-image: url('/static/images/home-hero-latest.jpg?v={{ app_version }}');"></div>
    <div class="home-bars" aria-hidden="true">
        <span class="home-bar"></span>
        <span class="home-bar"></span>
        <span class="home-bar"></span>
    </div>
    <button class="home-hotspot" id="unlockBtn" aria-label="Unlock for Rs 79"></button>
</div>

<div class="screen upload" id="uploadScreen" hidden>
    <div class="upload-title">CURRENT SELF</div>
    <div class="upload-frame">
        <div class="upload-frame-corners">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
        </div>
        <div class="upload-placeholder" id="uploadPlaceholder">
            <div class="face-outline"></div>
        </div>
        <img class="upload-preview" id="uploadPreview" src="" alt="">
    </div>
    <p class="upload-hint">Front-facing. Good light. No filters.</p>
    <button class="btn-take-photo" id="takePhotoBtn">TAKE PHOTO</button>
    <button class="btn-upload-photo" id="uploadPhotoBtn">UPLOAD PHOTO</button>

    <input type="file" id="cameraInput" accept="image/*" capture="user" style="display:none">
    <input type="file" id="libraryInput" accept="image/*" style="display:none">
    <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<div class="action-sheet-overlay" id="actionSheet">
    <div class="action-sheet">
        <div class="action-sheet-group">
            <button class="action-sheet-btn" id="photoLibraryBtn"><span>Photo Library</span></button>
            <button class="action-sheet-btn" id="takePhotoCameraBtn"><span>Take Photo</span></button>
        </div>
        <button class="action-sheet-cancel" id="cancelSheetBtn">Cancel</button>
    </div>
</div>

<div class="screen loading" id="loadingScreen" hidden>
    <div class="loading-title" id="loadingTitle">READING</div>
    <div class="loading-frame">
        <img class="loading-selfie" id="loadingSelfie" src="" alt="">
        <span class="loading-script">stay with me</span>
    </div>
    <div class="loading-status">
        <span class="loading-text" id="loadingText">Finding your next self</span>
    </div>
    <div class="loading-progress">
        <div class="loading-progress-fill" id="progressFill"></div>
    </div>
</div>

<div class="screen error" id="errorScreen" hidden>
    <div class="error-icon">!</div>
    <p class="error-text" id="errorText">Something went wrong</p>
    <button class="btn-retry" onclick="goHome()">Try Again</button>
</div>

<div class="screen results" id="resultsScreen" hidden>
    <div class="results-header">
        <h1 class="results-title">YOUR <span class="accent">3</span> LOOKS</h1>
        <button class="btn-back" onclick="goHome()">&#8592;</button>
    </div>
    <div class="results-carousel-wrap">
        <div class="results-carousel" id="resultsCarousel"></div>
    </div>
</div>

<div class="screen cutcard" id="cutcardScreen" hidden>
    <div class="cutcard-header">
        <button class="btn-back" onclick="backToResults()">&#8592;</button>
        <span class="cutcard-title">IDENTITY CUT CARD</span>
    </div>
    <div class="cutcard-content" id="cutcardContent"></div>
    <div class="cutcard-actions">
        <button class="btn-select" id="selectLookBtn">SELECT THIS LOOK</button>
    </div>
</div>

<div class="screen locked" id="lockedScreen" hidden>
    <div class="locked-photo">
        <img id="lockedPhoto" src="" alt="">
    </div>
    <div class="locked-badge">LOCKED</div>
    <div class="locked-actions">
        <button class="btn-barber" onclick="showBarber()">SHOW YOUR BARBER</button>
        <button class="btn-save" onclick="saveToPhone()">SAVE TO PHONE</button>
        <button class="btn-restart" onclick="goHome()">START OVER</button>
    </div>
</div>

<div class="screen barber" id="barberScreen" hidden>
    <div class="barber-header">
        <span class="barber-title">BARBER MODE</span>
        <button class="barber-close" onclick="backToLocked()">&#10005;</button>
    </div>
    <div class="barber-content" id="barberContent"></div>
</div>

<script>
    (function () {
        try {
            var screens = document.querySelectorAll('.screen');
            var active = document.querySelectorAll('.screen.active');
            var home = document.getElementById('homeScreen');
            if (active.length !== 1 || !home || !home.classList.contains('active')) {
                screens.forEach(function (node) {
                    node.classList.remove('active');
                    node.hidden = true;
                });
                if (home) home.classList.add('active');
                if (home) home.hidden = false;
                console.log('[StyleLock boot]', 'pre-js screen correction -> home');
            }
        } catch (err) {
            console.warn('[StyleLock boot]', 'pre-js guard error', err);
        }
    })();
</script>
<script>window.STYLELOCK_APP_VERSION = "{{ app_version }}";</script>
<script src="/static/js/app.js?v={{ app_version }}"></script>
</body>
</html>
